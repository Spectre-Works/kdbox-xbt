name: Test and build KD BOX XBT preview
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  preview:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Build controller, notices, and verified payload
        run: python tools/build.py
      - run: go test ./...
      - run: go vet ./...
      - name: Race-check controller on Linux
        if: runner.os == 'Linux'
        run: go test -race ./...
      - run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          node --check controller/web/app.js
          node --check controller/web/settings.js
      - name: Create editable, license-bearing installer package
        if: runner.os == 'Linux'
        run: python tools/package.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: KDBoxXBT-preview-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
