name: Apply reviewed rebrand source
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.maintenance/**'
      - '.github/workflows/apply-rebrand.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Spectre-Works/kdbox-xbt' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'rebrand/spectre-works'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact reviewed source correction
        run: python .maintenance/fix.py
      - name: Commit only verified source changes to the working branch
        shell: bash
        run: |
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep recovery device identity private alongside snapshot contents'
          git push origin HEAD:refs/heads/rebrand/spectre-works
